services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: productsdb
      POSTGRES_USER: <username>
      POSTGRES_PASSWORD: <password>
    ports:
      - "6000:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U products -d productsdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: